org.gradle.jvmargs=-Xmx2g
kotlin.code.style=official
# Android-сборка (этап 1 плана docs/260921_android_plan.md).
android.useAndroidX=true
# Версия продукта — мажор и минор; третий сегмент — номер билда (ниже). Обе
# формы собирает корневой build.gradle.kts: semver без ведущих нулей (1.0.60)
# идёт в packageVersion (:desktopApp), форма с ведущими нулями (1.0.060) — в
# имена файлов, versionName (:androidApp), «О программе», README комплекта и тег
# релиза (v1.0.060). Подробности — docs/brd.md, Т03 п.7.
v2m.version=1.0
# Номер билда v2m — единое место определения: отсюда его читают Build.kt
# (:shared, задача generateBuild) и versionCode (:androidApp). Поднимать на
# каждый билд, идущий на приёмку; номер соответствует записи в docs/history.md.
v2m.build=60
