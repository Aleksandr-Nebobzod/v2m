name: Build Desktop Distributives

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: false 

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Make scripts executable (Linux)
      if: runner.os == 'Linux'
      run: chmod +x ./app/gradlew

    - name: Build for Linux
      if: runner.os == 'Linux'
      run: ./app/gradlew :desktopApp:packageDistributionForCurrentOS

    - name: Build for Windows
      if: runner.os == 'Windows'
      run: .\app\gradlew.bat :desktopApp:packageDistributionForCurrentOS

    - name: Upload Linux Artifact
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: v2m-linux-x64-distributive
        path: app/desktopApp/build/compose/binaries/main/app/

    - name: Upload Windows Artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: v2m-windows-x64-distributive
        path: app/desktopApp/build/compose/binaries/main/app/
